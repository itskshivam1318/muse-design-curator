<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design Language Engine</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 14px; width: 280px; }
      h1 { font-size: 16px; margin: 0 0 6px; }
      input, select, button { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 8px; font: inherit; }
      input#code { letter-spacing: 0.3em; text-align: center; }

      .status.ok { color: #1b6e3c; }
      a { display: inline-block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popup.ts"></script>
