# fly.toml app configuration file generated for muse-curator on 2026-10-29T15:46:26+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'muse-curator'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:////data/dle.sqlite'
  DATA_DIR = '/data'
  DEMO_MODE = '0'
  IMAGE_PROVIDER = 'muse-image'
  PORT = '7860'

[[mounts]]
  source = 'muse_data'
  destination = '/data'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/demo/status'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
