# Fly.io: one machine serving the API (/api) and the built app (/) from the root Dockerfile.
#   fly launch --no-deploy --copy-config      # once; pick a free app name if this one is taken
#   fly volumes create muse_data --region bom --size 3
#   fly secrets set MODEL_API_KEY=...
#   fly deploy
# SQLite, SSE and rate limits live in one process: never run more than one machine.
app = "muse-curator"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  DATA_DIR = "/data"
  DATABASE_URL = "sqlite:////data/dle.sqlite"
  DEMO_MODE = "0"
  IMAGE_PROVIDER = "muse-image"

# First start copies the baked data/ snapshot onto the empty volume (docker-entrypoint.sh).
[mounts]
  source = "muse_data"
  destination = "/data"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/demo/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"

[[vm]]
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"
