# Fly.io: one machine serving the API (/api) and the built app (/) from the root Dockerfile.
# SQLite, SSE and rate limits live in one process: never run more than one machine.
#   fly deploy --ha=false
# Board data lives on the muse_data volume. The first start copied the baked data/ snapshot onto
# it (docker-entrypoint.sh); later deploys never overwrite /data, so testers' boards survive.

app = 'muse-curator'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:////data/dle.sqlite'
  DATA_DIR = '/data'
  DEMO_MODE = '0'
  IMAGE_PROVIDER = 'muse-image'
  PORT = '7860'

[[mounts]]
  source = 'muse_data'
  destination = '/data'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/demo/status'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
